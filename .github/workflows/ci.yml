name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile check
        run: python -m py_compile bot.py

      - name: Verify no bytecode committed
        run: |
          if git ls-files | grep -E "__pycache__|\.pyc$"; then
            echo "Bytecode files are tracked! Remove them."; exit 1
          fi
          echo "No bytecode tracked. OK"
